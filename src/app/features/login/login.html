<div class="flex min-h-screen bg-white">
  <!-- Left: Form -->
  <div class="flex-1 flex items-center justify-center p-10 max-md:p-6">
    <div class="w-full max-w-[420px]">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Chào mừng trở lại</h1>
      <p class="text-sm font-semibold text-gray-400 mb-9">Nhập tài khoản và mật khẩu để đăng nhập</p>

      @if (errorMessage(); as error) {
        <nz-alert
          class="mb-5"
          nzType="error"
          [nzMessage]="error"
          nzShowIcon
          nzCloseable
          (nzOnClose)="errorMessage.set('')"
        />
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-800 mb-2" for="account">Tài khoản</label>
          <app-input
            formControlName="account"
            placeholder="Email, số điện thoại hoặc tên đăng nhập"
            prefixIcon="user"
          />
        </div>

        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-800 mb-2" for="password">Mật khẩu</label>
          <app-input
            formControlName="password"
            type="password"
            placeholder="Nhập mật khẩu"
            prefixIcon="lock"
          />
        </div>

        <div class="flex items-center gap-3 mb-7">
          <app-switch formControlName="remember" size="small" />
          <span class="text-sm text-gray-400 font-medium">Ghi nhớ đăng nhập</span>
        </div>

        <button
          class="w-full py-3.5 text-xs font-bold tracking-wide text-white rounded-xl cursor-pointer transition-all duration-200 hover:opacity-90 active:scale-[0.99] disabled:opacity-70 disabled:cursor-not-allowed"
          style="background: linear-gradient(135deg, #4fd1c5 0%, #2c7a7b 100%)"
          [disabled]="loading()"
          type="submit"
        >
          @if (loading()) {
            ĐANG ĐĂNG NHẬP...
          } @else {
            ĐĂNG NHẬP
          }
        </button>

        <p class="text-center mt-6 text-sm text-gray-400 font-medium">
          Chưa có tài khoản?
          <a class="text-teal-400 font-bold cursor-pointer hover:underline">Đăng ký</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Right: Illustration -->
  <div class="flex-1 relative overflow-hidden flex items-center justify-center rounded-bl-2xl max-md:hidden signin-illustration">
    <div class="absolute inset-0">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
      <div class="shape shape-5"></div>
    </div>
  </div>
</div>
