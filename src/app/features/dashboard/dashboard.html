<div>
  <!-- Header -->
  <app-page-header title="Dashboard" />

  <!-- Stat Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
    @for (stat of stats; track stat.title) {
      <nz-card class="rounded-xl border-none shadow-sm">
        <div class="text-2xl font-bold text-gray-900 mb-2">{{ stat.value }}</div>
        <div class="flex items-center gap-2">
          <span
            class="text-xs font-semibold px-1.5 py-0.5 rounded inline-flex items-center gap-0.5"
            [class]="stat.isPositive ? 'text-green-500 bg-green-50' : 'text-red-500 bg-red-50'"
          >
            <nz-icon [nzType]="stat.isPositive ? 'arrow-up' : 'arrow-down'" />
            {{ stat.change > 0 ? '+' : '' }}{{ stat.change }}%
          </span>
          <span class="text-sm text-gray-400">{{ stat.title }}</span>
        </div>
      </nz-card>
    }
  </div>

  <!-- Product Sales Chart -->
  <nz-card class="rounded-xl border-none shadow-sm mb-6">
    <h3 class="text-base font-semibold text-gray-900 mb-1">Product sales</h3>
    <div class="flex items-center gap-2 mb-4">
      <span class="text-3xl font-bold text-green-500">${{ '52,187' }}</span>
      <span class="text-xs font-semibold text-green-500 inline-flex items-center gap-0.5">
        <nz-icon nzType="arrow-up" /> +2.4%
      </span>
    </div>
    <div echarts [options]="productSalesOptions" class="w-full h-[300px]"></div>
  </nz-card>

  <!-- Bottom charts row -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" style="grid-template-columns: repeat(auto-fit, minmax(450px, 1fr))">
    <nz-card class="rounded-xl border-none shadow-sm">
      <h3 class="text-base font-semibold text-gray-900 mb-1">Sales by product category</h3>
      <div echarts [options]="categoryOptions" class="w-full h-[320px]"></div>
    </nz-card>

    <nz-card class="rounded-xl border-none shadow-sm">
      <h3 class="text-base font-semibold text-gray-900 mb-1">Sales by countries</h3>
      <div echarts [options]="countriesOptions" class="w-full h-[320px]"></div>
    </nz-card>
  </div>
</div>
